name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Package plugin
        run: |
          zip -r hana-magpie.zip \
            manifest.json index.js lib routes tools assets docs \
            README.md README.zh-CN.md NOTICE.md LICENSE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: hana-magpie.zip
          generate_release_notes: true
