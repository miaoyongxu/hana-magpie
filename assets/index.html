<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magpie</title>
<script>
  // HanaAgent appends hana-asset-base (the assets URL with its session token)
  // to the iframe URL. A sandboxed plugin frame may not send the asset cookie,
  // so the token-bearing base is what actually makes CSS/JS load.
  (function () {
    var params = new URLSearchParams(location.search);
    var raw = params.get("hana-asset-base") || "/api/plugins/hana-magpie/assets";
    function asset(file) {
      try {
        var u = new URL(raw, location.href);
        u.pathname = u.pathname.replace(/\/+$/, "") + "/" + file;
        return u.href;
      } catch (e) {
        return "/api/plugins/hana-magpie/assets/" + file;
      }
    }
    window.__HANA_MAGPIE_ASSET__ = asset;
    ["app.css", "plugins.css", "overrides.css"].forEach(function (f) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = asset(f);
      document.head.appendChild(l);
    });
    // HanaAgent hands the plugin the theme's own CSS (hana-css) and its
    // concrete appearance. Load that after Magpie's styles, then map Hana's
    // tokens onto the names this port uses.
    var appearance = params.get("hana-theme-appearance") || "";
    var themeId = params.get("hana-theme") || "";
    var hostCss = params.get("hana-css") || "";
    var themeLink = null;
    var mode = appearance === "dark" || appearance === "light"
      ? appearance
      : (/(dark|night|midnight|black)/i.test(themeId) ? "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    var root = document.documentElement;
    // When HanaAgent provides its theme CSS, keep the plugin on its neutral
    // base palette and let the host CSS own the colours. In particular, do
    // not put the plugin into its own dark palette: that selector is more
    // specific than the host's :root and would hide the host background.
    root.dataset.theme = hostCss ? "light" : mode;
    root.dataset.hanaAppearance = mode;
    if (themeId) root.dataset.hanaTheme = themeId;
    if (hostCss) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.id = "hanaThemeCss";
      l.href = hostCss;
      document.head.appendChild(l);
      themeLink = l;
      root.classList.add("hana-host-theme");
      var map = document.createElement("style");
      map.id = "hanaThemeMap";
      map.textContent = [
        ":root.hana-host-theme {",
        "  --card: var(--bg-card, #fff);",
        "  --card-2: color-mix(in srgb, var(--bg-card, #fff) 82%, var(--bg, #f4f4f6));",
        "  --pill: color-mix(in srgb, var(--bg-card, #fff) 64%, var(--bg, #f4f4f6));",
        "  --pill-hover: color-mix(in srgb, var(--bg-card, #fff) 46%, var(--bg, #f4f4f6));",
        "  --seg-track: color-mix(in srgb, var(--bg-card, #fff) 55%, var(--bg, #f4f4f6));",
        "  --seg-thumb: var(--bg-card, #fff);",
        "  --fg: var(--text, #1c1c21);",
        "  --fg-2: var(--text-light, #4b4b53);",
        "  --muted: var(--text-muted, #85858d);",
        "  --faint: color-mix(in srgb, var(--text-muted, #85858d) 55%, transparent);",
        "  --line: var(--border, #e3e3e8);",
        "  --line-2: color-mix(in srgb, var(--border, #e3e3e8) 60%, transparent);",
        "  --ctl-fg: var(--text-light, #63636b);",
        "  --accent-soft: var(--accent-light, #eeedfd);",
        "  --sel: var(--accent-light, #ecebfb);",
        "  --pop-bg: var(--bg-glass, rgba(255,255,255,.94));",
        "  --shadow: 0 16px 44px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08), 0 0 0 .5px var(--border, rgba(0,0,0,.08));",
        "  --green: var(--green, #189a58);",
        "  --red: var(--danger, #d64545);",
        "  --amber: var(--coral, #b45309);",
        "  --green-soft: color-mix(in srgb, var(--green, #189a58) 16%, var(--bg, #f4f4f6));",
        "  --red-soft: color-mix(in srgb, var(--danger, #d64545) 14%, var(--bg, #f4f4f6));",
        "  --amber-soft: color-mix(in srgb, var(--coral, #b45309) 16%, var(--bg, #f4f4f6));",
        "}",
        ":root.hana-host-theme .sidebar { background: var(--sidebar-bg, var(--card)); }",
        ":root.hana-host-theme[data-hana-appearance=\"dark\"] { --accent-fg: var(--bg, #14142a); }",
      ].join("\n");
      document.head.appendChild(map);
    }
    // HanaAgent can update the theme without a full plugin reload; accept the
    // same query fields over postMessage when it does.
    window.addEventListener("message", function (e) {
      var d = e && e.data;
      if (!d || typeof d !== "object") return;
      var next = d.appearance || d.themeAppearance || "";
      var nextTheme = d.theme || d.themeId || "";
      if (next === "dark" || next === "light") root.dataset.theme = hostCss ? "light" : next;
      if (next === "dark" || next === "light") root.dataset.hanaAppearance = next;
      if (nextTheme) root.dataset.hanaTheme = nextTheme;
      var nextCss = d.css || d.themeCss || d.hanaCss || "";
      if (nextCss && themeLink) themeLink.href = nextCss;
    });
  })();
</script>
</head>

<script>
  (function () {
    var s = document.createElement("script");
    s.src = window.__HANA_MAGPIE_ASSET__("app.js");
    s.onerror = function () {
      var v = document.getElementById("view");
      if (v) v.innerHTML = '<div class="hm-empty"><b>Magpie 资源加载失败</b>请重新打开插件；如果仍然失败，检查 HanaAgent 插件资产会话。</div>';
    };
    document.body.appendChild(s);
  })();
</script>
